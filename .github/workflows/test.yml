name: Validate skill and release package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Python regressions and frozen contract compatibility
        run: python -B evaluation/run-python-tests.py
      - name: Enforce Python-only source
        run: python -B evaluation/skill_tools.py check-python-only
      - name: Native skill and synthetic-example checks
        run: |
          python -B evaluation/skill_tools.py check-skill
          python -B evaluation/skill_tools.py check-examples
      - name: Native release package verification
        run: python -B evaluation/skill_tools.py check-package
