name: Validate skill and release package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      # Actions are pinned to full commit SHAs (resolved with git ls-remote;
      # each tag is lightweight and points directly at the named release commit).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # One command per step: a multi-command PowerShell step would only report
      # the exit code of its last command and could hide an earlier failure.
      - name: Tag must equal v + VERSION on tag pushes
        if: startsWith(github.ref, 'refs/tags/')
        run: python -B -c "import os, pathlib, sys; version = pathlib.Path('VERSION').read_text(encoding='utf-8').strip(); expected = 'v' + version; actual = os.environ.get('GITHUB_REF_NAME', ''); print('release tag check - GITHUB_REF_NAME=' + actual + ' expected=' + expected + ' VERSION=' + version); sys.exit(0 if actual == expected else 1)"
      - name: Release archive must not be tracked
        run: python -B -c "import subprocess, sys; tracked = subprocess.run(['git', 'ls-files', '--error-unmatch', 'dist/ai-research-mentor.zip'], capture_output=True).returncode == 0; sys.exit(1 if tracked else 0)"
      - name: Python regressions and frozen contract compatibility
        run: python -B evaluation/run-python-tests.py
      - name: Enforce Python-only source
        run: python -B evaluation/skill_tools.py check-python-only
      - name: Native skill structure check
        run: python -B evaluation/skill_tools.py check-skill
      - name: Synthetic example checks
        run: python -B evaluation/skill_tools.py check-examples
      - name: Writing template guardrail check
        run: python -B evaluation/skill_tools.py check-templates
      - name: Build deterministic release package
        run: python -B evaluation/skill_tools.py package
      - name: Verify package against source and rebuild determinism
        run: python -B evaluation/skill_tools.py check-package
      # Portable here means the same command works in bash and pwsh, and the
      # checksum file is byte-identical on every OS (explicit LF, no newline
      # translation, no hard-coded hash).
      - name: Write deterministic SHA-256 checksum of release package
        run: python -B -c "import hashlib, pathlib; archive = pathlib.Path('dist/ai-research-mentor.zip'); checksum_file = pathlib.Path('dist/ai-research-mentor.zip.sha256'); digest = hashlib.sha256(archive.read_bytes()).hexdigest(); checksum_file.write_bytes((digest + '  ' + archive.name + '\n').encode('ascii')); print(digest + '  ' + archive.name)"
      - name: Upload release package as a run artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-research-mentor-package
          path: |
            dist/ai-research-mentor.zip
            dist/ai-research-mentor.zip.sha256
          if-no-files-found: error
