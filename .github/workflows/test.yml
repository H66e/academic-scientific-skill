name: Validate skill and release package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Python core and Node projection compatibility
        run: python -B evaluation/run-python-tests.py
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run research, evolution, and packaging tests
        run: node evaluation/run-tests.mjs
      - name: Check skill metadata and local references
        run: node evaluation/check-skill.mjs skills/ai-research-mentor
      - name: Validate explicitly synthetic examples
        run: node evaluation/check-examples.mjs
      - name: Compare release package with skill source
        run: node evaluation/check-package.mjs
