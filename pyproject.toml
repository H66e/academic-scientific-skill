[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-mentor"
version = "0.3.0"
description = "Local evidence ledger and bounded AI/ML research decisions"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "H66e" }]
dependencies = []

[project.scripts]
research-mentor = "research_mentor.cli:main"

[tool.setuptools]
package-dir = {"" = "skills/ai-research-mentor/runtime"}

[tool.setuptools.packages.find]
where = ["skills/ai-research-mentor/runtime"]
